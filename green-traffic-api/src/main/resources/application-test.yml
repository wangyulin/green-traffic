spring:
  application:
    name: green-traffic

  datasource:
    url: jdbc:mysql://localhost:3306/green_traffic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: green_traffic
    password: 123456Aa@
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: MySQLConnectionPool

traffic:
  storage:
    type: influx
  influxdb:
    url: ${INFLUXDB_URL:http://localhost:8086}
    token: ${INFLUXDB_TOKEN:mi1ZhIYdLj3kF0GxEpcR3IWVwHLxylVY5Fhf5gtOZ18dF7j5i6P9PslgpWRge5czcS0nVoFBYANDkMMnJRwI5Q==}
    org: ${INFLUXDB_ORG:wyl}
    bucket: ${INFLUXDB_BUCKET:green-traffic}
    connect-timeout: 10s
    read-timeout: 30s
    write-timeout: 10s

# RocketMQ 配置
rocketmq:
  name-server: localhost:9876
  producer:
    group: traffic-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 3
    retry-times-when-send-async-failed: 3
    compress-message-body-threshold: 4096
    max-message-size: 4194304
    retry-next-server: true

  consumer:
    group: traffic-consumer-group
    topic: traffic-default-topic
    consume-message-batch-max-size: 10
    pull-batch-size: 10

# 消息配置
messaging:
  type: rocketmq  # 使用 RocketMQ
  
logging:
  level:
    root: INFO
    com.greentraffic: INFO
    org.springframework: INFO

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  health:
    db:
      enabled: false