spring:
  autoconfigure:
    exclude:
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  application:
    name: green-traffic
  # 使用 Spring Events，无需额外配置
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/green_traffic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: green_traffic
    password: 123456Aa@
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: MySQLConnectionPool

traffic:
  storage:
    type: influx
  influxdb:
    url: ${INFLUXDB_URL:http://localhost:8086}
    token: ${INFLUXDB_TOKEN:mi1ZhIYdLj3kF0GxEpcR3IWVwHLxylVY5Fhf5gtOZ18dF7j5i6P9PslgpWRge5czcS0nVoFBYANDkMMnJRwI5Q==}
    org: ${INFLUXDB_ORG:wyl}
    bucket: ${INFLUXDB_BUCKET:green-traffic}
    connect-timeout: 10s
    read-timeout: 30s
    write-timeout: 10s

metrics:
  batch-size: ${METRICS_BATCH_SIZE:500}
  influx-url: ${INFLUX_URL:http://localhost:8086/api/v2/write?org=${INFLUXDB_ORG:wyl}&bucket=${INFLUXDB_BUCKET:green-traffic}&precision=ns}
  auth-type: bearer
  token: ${INFLUXDB_TOKEN:mi1ZhIYdLj3kF0GxEpcR3IWVwHLxylVY5Fhf5gtOZ18dF7j5i6P9PslgpWRge5czcS0nVoFBYANDkMMnJRwI5Q==}
  max-retries: ${METRICS_MAX_RETRIES:3}
  retry-initial-delay-ms: ${METRICS_RETRY_INITIAL_DELAY_MS:500}
  flush-interval-ms: ${METRICS_FLUSH_INTERVAL_MS:2000}

# 消息配置：开发环境使用 Spring Events
messaging:
  type: events
  # 异步消息发布线程池（开发环境）
  executor:
    core-pool-size: ${MESSAGING_EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${MESSAGING_EXECUTOR_MAX_POOL_SIZE:8}
    queue-capacity: ${MESSAGING_EXECUTOR_QUEUE_CAPACITY:1000}
    thread-name-prefix: ${MESSAGING_EXECUTOR_THREAD_NAME_PREFIX:msg-exec-}
green-traffic:
  sumo:
    enabled: ${SUMO_ENABLED:true}
    working-directory: ${SUMO_WORKING_DIRECTORY:./sumo-work}
    interval-ms: ${SUMO_INTERVAL_MS:10000}
    duration-seconds: ${SUMO_DURATION_SECONDS:300}
    vehicles-per-hour: ${SUMO_VEHICLES_PER_HOUR:300}

logging:
  level:
    root: INFO
    com.greentraffic: INFO
    org.springframework: INFO

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  health:
    db:
      enabled: false

